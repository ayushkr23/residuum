[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "residuum"
version = "0.1.0"
description = "Possess an open-weight language model through residual-stream steering, not a persona prompt."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ayush" }]
dependencies = [
  "transformers>=4.44",
  "torch>=2.1",
  "numpy>=1.24",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
residuum = "residuum.server:main"

[tool.setuptools.packages.find]
include = ["residuum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
